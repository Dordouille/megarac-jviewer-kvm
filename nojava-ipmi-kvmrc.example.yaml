# nojava-ipmi-kvm configuration for the ASUS ASMB8-iKVM BMC (AMI MegaRAC / JViewer).
#
# Copy the relevant parts into ~/.nojava-ipmi-kvmrc.yaml, then run:
#     nojava-ipmi-kvm myserver
# The tool spins up a container with an old Java Web Start, logs into the BMC,
# launches the JViewer .jnlp, and serves the console in your browser via noVNC.
# The BMC password is prompted at runtime -- nothing is stored on disk.
#
# Requires the patched image built from ./megarac-patch (see README): without it
# the viewer launches but can never reach the host's video.

hosts:
  myserver:
    based_on: kvm-asmb8
    # The BMC itself -- the physical host's management controller, not a VM.
    full_hostname: 192.0.2.10

templates:
  kvm-asmb8:
    skip_login: False
    login_user: admin
    login_endpoint: rpc/WEBSES/create.asp
    user_login_attribute_name: WEBVAR_USERNAME
    password_login_attribute_name: WEBVAR_PASSWORD
    send_post_data_as_json: False
    session_cookie_key: SessionCookie
    allow_insecure_ssl: True

    # Both query parameters are mandatory on this firmware:
    #
    #   JNLPSTR=JViewer  without it the BMC returns "Unable to find JNLP String"
    #                    instead of the <application-desc> launch arguments.
    #   EXTRNIP=<ip>     copied verbatim into JViewer's -hostname argument, so it
    #                    must be the BMC's own address. Point it at the client by
    #                    mistake and the viewer dutifully connects to the client.
    #
    # Keep this IP in sync with full_hostname above.
    download_endpoint: "Java/jviewer.jnlp?EXTRNIP=192.0.2.10&JNLPSTR=JViewer"

    # 7u79 selects the openjdk-7 image, which is what ./megarac-patch builds on.
    java_version: 7u79
    format_jnlp: False
